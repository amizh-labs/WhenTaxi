[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eta-mlops"
version = "0.1.0"
description = "End-to-end MLOps platform predicting NYC yellow taxi trip duration (ETA)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas<3",  # feast needs pandas 2.x; unpinned, pip picks pandas 3 and backtracks to feast 0.28, which cannot build
    "pyarrow",
    "pandera",
    "lightgbm",
    "mlflow",
    "feast",
    "dvc",
]

[project.optional-dependencies]
serving = ["fastapi", "uvicorn", "prometheus-client", "httpx"]
flows = ["prefect"]
monitoring = ["evidently"]
dev = ["pytest", "ruff"]
geo = ["pyshp", "pyproj"]  # one-time scripts/build_zone_centroids.py only; not needed by CI, training or serving

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
