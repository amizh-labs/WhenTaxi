name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,serving,flows,monitoring]"
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

      - name: Lint (ruff)
        run: ruff check .

      - name: Data checks (Pandera schema, cleaning rules, fixture contract)
        run: pytest -q tests/test_validation.py tests/test_data_checks.py

      - name: Skew test (Feast offline vs online, training vs serving features)
        run: pytest -q tests/test_feast_skew.py tests/test_rolling.py tests/test_features.py tests/test_pair_snapshots.py

      - name: Training smoke test (train, register, aliases, unseen zone)
        run: pytest -q tests/test_training.py

      # Real data: the public NYC TLC files + Open-Meteo weather, rebuilt by scripts/download_data.py.
      # Cached so most runs skip the ~190 MB download.
      - name: Cache real data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/download_data.py') }}
      - name: Download real data
        run: python scripts/download_data.py

      # Cleans the real Jan-Mar files, trains on a seeded 500k-row Jan-Feb sample, validates on March,
      # and fails if validation MAE is more than 2% worse than .github/metric_reference_real.json.
      # Intentional change? Refresh with: python -m evaluation.gate --update
      - name: Metric-regression gate (real data)
        run: python -m evaluation.gate

      - name: Remaining tests (serving, flows, evaluation, monitoring)
        run: >
          pytest -q
          --ignore=tests/test_validation.py --ignore=tests/test_data_checks.py
          --ignore=tests/test_feast_skew.py --ignore=tests/test_rolling.py
          --ignore=tests/test_features.py --ignore=tests/test_pair_snapshots.py
          --ignore=tests/test_training.py

  docker-build:
    # Catches a broken Dockerfile on the PR; the image is only pushed on merge (cd.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eta-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
